[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyroboplan"
version = "1.3.0"
dependencies = [
  "drake >=1.51.0,<1.53.0",
  "pin == 4.0.0",
  "matplotlib == 3.10.9",
  "meshcat == 0.3.2",
  "scipy >=1.15.3,<=1.17.1",
  "toppra == 0.6.3",
  "plyfile == 1.1.4",
]
requires-python = ">=3.10"
authors = [
  {name = "Sebastian Castro", email = "sebas.a.castro@gmail.com"},
]
maintainers = [
  {name = "Sebastian Castro", email = "sebas.a.castro@gmail.com"},
]
description = "Educational Python library for manipulator motion planning."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["motion planning", "manipulators", "education"]
